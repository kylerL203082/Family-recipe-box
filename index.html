<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Family Recipe Box</title>

<style>
:root {
  --green: #365440;
  --green-dark: #213a2c;
  --cream: #faf8f2;
  --sage: #e8eee5;
  --text: #29372c;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
}

button, input, select {
  font: inherit;
}

button, a.button {
  cursor: pointer;
}

.topbar {
  background: white;
  min-height: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 5%;
  gap: 15px;
}

.brand {
  color: var(--green);
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: bold;
  text-decoration: none;
}

.button {
  display: inline-block;
  border: none;
  border-radius: 9px;
  background: var(--green);
  color: white;
  padding: 13px 20px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
}

.button:hover {
  background: var(--green-dark);
}

.button.light {
  background: #f5f3ec;
  color: var(--green-dark);
}

.hero {
  min-height: 600px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  isolation: isolate;
  background: #283c2d;
  color: white;
  padding: 90px 20px;
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transform: scale(1.06);
  transition: opacity 2s ease, transform 8s linear;
  z-index: -2;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(16, 28, 18, 0.58);
}

.hero-content {
  width: 100%;
  max-width: 760px;
}

.hero-icon {
  font-size: 56px;
  margin-bottom: 15px;
}

.hero h1 {
  font-family: Georgia, serif;
  font-size: clamp(38px, 6vw, 68px);
  font-weight: normal;
  margin: 0 0 15px;
  text-shadow: 0 3px 12px #0006;
}

.hero-subtitle {
  font-size: 18px;
  margin-bottom: 38px;
}

.search-wrap {
  display: flex;
  align-items: center;
  background: white;
  border-radius: 100px;
  padding: 7px 20px;
  box-shadow: 0 10px 40px #0004;
  color: var(--green);
  gap: 12px;
}

.search-icon {
  font-size: 26px;
}

.search-wrap input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  padding: 16px 4px;
  font-size: 18px;
  color: var(--text);
}

.hero-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.categories {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 26px;
}

.categories button {
  border: 1px solid #ffffff69;
  border-radius: 25px;
  background: #ffffff20;
  color: white;
  padding: 9px 16px;
}

.categories button:hover {
  background: #ffffff45;
}

.main-content {
  max-width: 1150px;
  margin: auto;
  padding: 55px 20px 90px;
}

.section-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.section-top h2 {
  font: normal 34px Georgia, serif;
  margin: 0 0 10px;
}

.muted {
  color: #6c796d;
  font-size: 14px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.controls select,
.controls button {
  padding: 11px 15px;
  border-radius: 9px;
  border: 1px solid #cbd4c9;
  background: white;
  color: var(--green);
}

.status {
  padding: 15px;
  border-radius: 10px;
  background: var(--sage);
  margin-bottom: 25px;
  line-height: 1.5;
}

.status.error {
  background: #fce8e4;
  color: #8a3027;
}

.recipe-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(250px, 1fr));
  gap: 22px;
}

.recipe-card {
  width: 100%;
  border: 1px solid #e0e5dc;
  border-radius: 15px;
  background: white;
  padding: 0;
  overflow: hidden;
  text-align: left;
  color: var(--text);
  box-shadow: 0 5px 18px #0000000d;
  transition: transform .2s, box-shadow .2s;
}

.recipe-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 26px #00000020;
}

.recipe-image {
  height: 175px;
  display: grid;
  place-items: center;
  background: linear-gradient(
    135deg, #e4ddc3, #d4e0ce
  );
  font-size: 55px;
  overflow: hidden;
}

.recipe-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.recipe-info {
  padding: 20px;
}

.recipe-info h3 {
  font: normal 23px Georgia, serif;
  margin: 10px 0;
}

.tag {
  display: inline-block;
  background: var(--sage);
  color: var(--green);
  border-radius: 30px;
  padding: 6px 11px;
  font-size: 12px;
}

.empty {
  grid-column: 1 / -1;
  padding: 45px;
  text-align: center;
  background: white;
  border-radius: 12px;
  color: #687668;
}

dialog {
  width: min(680px, calc(100% - 24px));
  max-height: 90vh;
  overflow: auto;
  border: none;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 18px 70px #0005;
}

dialog::backdrop {
  background: #16271ac0;
}

dialog h2 {
  font: normal 34px Georgia, serif;
  margin-top: 10px;
}

.dialog-image {
  width: 100%;
  max-height: 340px;
  object-fit: cover;
  border-radius: 12px;
}

.recipe-text {
  white-space: pre-wrap;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.dialog-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 25px;
}

footer {
  text-align: center;
  padding: 35px 15px;
  border-top: 1px solid #e4e7e0;
  background: white;
  color: #6d786c;
}

footer a {
  color: var(--green);
  margin: 0 10px;
}

@media(max-width: 600px) {
  .brand { font-size: 17px; }
  .topbar .button { padding: 11px; font-size: 13px; }
  .hero { min-height: 560px; }
  .hero-subtitle { font-size: 15px; }
  .search-wrap input { font-size: 15px; }
  .main-content { padding-top: 35px; }
}

@media(prefers-reduced-motion: reduce) {
  .slide {
    transition: none;
    transform: none !important;
  }
}

@media print {
  .topbar, .hero, .main-content,
  footer, .dialog-actions {
    display: none !important;
  }
  dialog {
    position: static;
    width: 100%;
    max-height: none;
    box-shadow: none;
    border: none;
  }
  dialog::backdrop { display: none; }
}
</style>
</head>

<body>

<header class="topbar">
  <a href="#" class="brand">📖 The Family Recipe Box</a>

  <a
    class="button"
    id="topAddRecipe"
    target="_blank"
    rel="noopener noreferrer"
  >
    + Add a Recipe
  </a>
</header>

<section class="hero">

  <div class="slide active"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>

  <div class="hero-content">

    <div class="hero-icon">📖</div>

    <h1>The Family Recipe Box</h1>

    <p class="hero-subtitle">
      Family recipes. Shared memories. Made with love.
    </p>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>

      <input
        type="search"
        id="recipeSearch"
        placeholder="Search recipes or family members..."
        aria-label="Search family recipes"
        autocomplete="off"
      >
    </div>

    <div class="hero-buttons">
      <button class="button" id="searchButton">
        Search Recipes
      </button>

      <button class="button light" id="browseButton">
        Browse All Recipes
      </button>
    </div>

    <div class="categories">
      <button data-category="Desserts">Desserts</button>
      <button data-category="Dinner">Dinner</button>
      <button data-category="Breakfast">Breakfast</button>
      <button data-category="Holiday Favorites">
        Holiday Favorites
      </button>
    </div>

  </div>
</section>

<main class="main-content" id="results">

  <div class="section-top">

    <div>
      <h2>Our Family Recipes</h2>
      <p class="muted" id="recipeCount">
        Loading recipes...
      </p>
    </div>

    <div class="controls">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>

      <button id="refreshButton">
        ↻ Refresh Recipes
      </button>
    </div>

  </div>

  <div id="status" class="status">
    Connecting to our family recipe collection...
  </div>

  <div class="recipe-grid" id="recipeGrid"></div>

</main>

<dialog id="recipeDialog">

  <div id="recipeDetails"></div>

  <div class="dialog-actions">
    <button class="button light" id="closeDialog">
      Close
    </button>

    <a
      class="button light"
      id="changeLink"
      target="_blank"
      rel="noopener noreferrer"
    >
      Request a Change
    </a>

    <button class="button" id="printRecipe">
      Print Recipe
    </button>
  </div>

</dialog>

<footer>
  <p>Made for sharing, one family recipe at a time.</p>

  <a
    id="footerAddRecipe"
    target="_blank"
    rel="noopener noreferrer"
  >Add a Recipe</a>

  <a
    id="footerAdmin"
    target="_blank"
    rel="noopener noreferrer"
  >Administrator</a>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

<script>
// ===========================================
// THE FAMILY RECIPE BOX
// Google Sheets Integration
// ===========================================

// Published recipe spreadsheet, Form Responses 1
const RECIPE_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/" +
  "2PACX-1vTZtuerLQIRIolsO0NOBzJTxQSNC_iY7pIaFGzzdPmvwN1a19ncfFQ9ySWsuuuHnteSobo_S5_vNLM9" +
  "/pub?gid=1445592232&single=true&output=csv";

// Working Google Form for adding recipes
const ADD_RECIPE_URL =
  "https://docs.google.com/forms/d/e/" +
  "1FAIpQLSfx_Arz0pz7ggKSngkFQvwGfIBA1z_meJYhiBQP1TupkOvmBQ/viewform";

// Working Google Form for requesting corrections
const REQUEST_CHANGE_URL =
  "https://docs.google.com/forms/d/e/" +
  "1FAIpQLSeTtEexX77aV5ukA0eL1NvSQLjCDBrAvWGco7xHMreO0ZoB3w/viewform";

// Private administrator spreadsheet
const ADMIN_URL =
  "https://docs.google.com/spreadsheets/d/" +
  "1HXpUXJvhlhMxOSvldRcDCoWVAaCSR6GUTlu4VjtWHjc/edit";

// ===========================================
// ROTATING FOOD BACKGROUND
// ===========================================

const backgroundPhotos = [
  // Cookies
  "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=2000&q=85",

  // Thanksgiving turkey
  "https://unsplash.com/photos/kEwZW6V6yLM/download?force=true&w=2000",

  // Homemade pie
  "https://images.unsplash.com/photo-1464305795204-6f5bbfc7fb81?auto=format&fit=crop&w=2000&q=85",

  // Pasta
  "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=2000&q=85",

  // Fresh family meal
  "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=2000&q=85"
];

const slides = [...document.querySelectorAll(".slide")];

slides.forEach((slide, i) => {
  slide.style.backgroundImage =
    `url("${backgroundPhotos[i]}")`;
});

let activeSlide = 0;

if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(() => {
    slides[activeSlide].classList.remove("active");

    activeSlide = (activeSlide + 1) % slides.length;

    slides[activeSlide].classList.add("active");
  }, 7000);
}

// ===========================================
// WEBSITE LINKS
// ===========================================

document.getElementById("topAddRecipe").href =
  ADD_RECIPE_URL;

document.getElementById("footerAddRecipe").href =
  ADD_RECIPE_URL;

document.getElementById("footerAdmin").href =
  ADMIN_URL;

document.getElementById("changeLink").href =
  REQUEST_CHANGE_URL;

// ===========================================
// RECIPE DATABASE
// ===========================================

const searchInput =
  document.getElementById("recipeSearch");

const recipeGrid =
  document.getElementById("recipeGrid");

const categoryFilter =
  document.getElementById("categoryFilter");

const recipeCount =
  document.getElementById("recipeCount");

const statusBox =
  document.getElementById("status");

const recipeDialog =
  document.getElementById("recipeDialog");

let allRecipes = [];

// Escape text before inserting it into HTML
function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

// Accept only ordinary web URLs for photos
function safePhotoURL(value) {
  try {
    const url = new URL(String(value || "").trim());

    if (url.protocol === "https:" ||
        url.protocol === "http:") {
      return url.href;
    }
  } catch (error) {
    return "";
  }

  return "";
}

function setStatus(message, isError = false) {
  statusBox.textContent = message;
  statusBox.className =
    isError ? "status error" : "status";
}

// Load recipes from the published sheet
async function loadRecipes() {
  setStatus("Loading family recipes...");

  try {
    if (typeof Papa === "undefined") {
      throw new Error(
        "The CSV reader could not load. Check your internet connection."
      );
    }

    const url =
      RECIPE_CSV_URL + "&refresh=" + Date.now();

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Google Sheets returned error " +
        response.status
      );
    }

    const csvText = await response.text();

    if (/^\s*</.test(csvText)) {
      throw new Error(
        "Google returned a webpage instead of CSV. " +
        "Check that Form Responses 1 is published as CSV."
      );
    }

    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: "greedy"
    });

    const headers = parsed.meta.fields || [];

    if (
      !headers.includes("Recipe Name") ||
      !headers.includes("Contributor Name") ||
      !headers.includes("Ingredients")
    ) {
      throw new Error(
        "The published data is not the correct recipe tab. " +
        "Publish Form Responses 1, not the whole spreadsheet."
      );
    }

    allRecipes = parsed.data
      .filter(row =>
        String(row["Recipe Name"] || "").trim()
      )
      .map((row, index) => ({
        id: index,

        title: String(
          row["Recipe Name"] || ""
        ).trim(),

        author: String(
          row["Contributor Name"] || ""
        ).trim(),

        category: String(
          row["Category"] || "Other"
        ).trim(),

        prep: String(
          row["Prep Time"] || ""
        ).trim(),

        cook: String(
          row["Cook Time"] || ""
        ).trim(),

        servings: String(
          row["Servings or Yield"] || ""
        ).trim(),

        ingredients: String(
          row["Ingredients"] || ""
        ).trim(),

        instructions: String(
          row["Cooking Instructions"] || ""
        ).trim(),

        story: String(
          row["Family Story or Special Notes"] || ""
        ).trim(),

        photo: String(
          row["Recipe Photo Link (Optional)"] || ""
        ).trim(),

        date: String(
          row["Timestamp"] || ""
        ).trim()
      }))
      .reverse();

    updateCategories();
    renderRecipes();

    setStatus(
      "Recipe collection connected! " +
      "Search by family member, recipe name, or ingredient."
    );

  } catch (error) {
    console.error("Recipe loading error:", error);

    setStatus(
      "Could not load recipes: " + error.message,
      true
    );

    recipeCount.textContent =
      "Recipes unavailable";

    recipeGrid.innerHTML = "";
  }
}

// ===========================================
// CATEGORY FILTERS
// ===========================================

function updateCategories() {
  const previous = categoryFilter.value;

  const categories = [
    ...new Set(
      allRecipes.map(r => r.category).filter(Boolean)
    )
  ].sort();

  categoryFilter.innerHTML =
    '<option value="">All Categories</option>';

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categoryFilter.appendChild(option);
  });

  if (categories.includes(previous)) {
    categoryFilter.value = previous;
  }
}

// ===========================================
// SEARCH BY RECIPE AND FAMILY MEMBER
// ===========================================

function renderRecipes() {
  const searchWords = searchInput.value
    .toLowerCase()
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  const selectedCategory = categoryFilter.value;

  const matchingRecipes = allRecipes.filter(recipe => {
    const searchableText = [
      recipe.title,
      recipe.author,
      recipe.category,
      recipe.ingredients,
      recipe.story
    ].join(" ").toLowerCase();

    const matchesSearch =
      searchWords.every(word =>
        searchableText.includes(word)
      );

    const matchesCategory =
      !selectedCategory ||
      recipe.category === selectedCategory;

    return matchesSearch && matchesCategory;
  });

  recipeCount.textContent =
    matchingRecipes.length +
    (matchingRecipes.length === 1
      ? " recipe found"
      : " recipes found");

  recipeGrid.innerHTML = "";

  if (!matchingRecipes.length) {
    recipeGrid.innerHTML = `
      <div class="empty">
        <h3>No recipes found</h3>
        <p>
          Try another recipe name, ingredient,
          or family member.
        </p>
      </div>
    `;
    return;
  }

  matchingRecipes.forEach(recipe => {
    const card = document.createElement("button");

    card.type = "button";
    card.className = "recipe-card";

    let emoji = "🍲";

    const category = recipe.category.toLowerCase();

    if (category.includes("dessert")) emoji = "🍪";
    else if (category.includes("breakfast")) emoji = "🥞";
    else if (category.includes("soup")) emoji = "🥣";
    else if (category.includes("bread")) emoji = "🍞";
    else if (category.includes("holiday")) emoji = "🦃";
    else if (category.includes("appetizer")) emoji = "🧀";

    const photoURL = safePhotoURL(recipe.photo);

    const imageMarkup = photoURL
      ? `<img src="${escapeHTML(photoURL)}"
              alt="${escapeHTML(recipe.title)}"
              loading="lazy">`
      : emoji;

    card.innerHTML = `
      <div class="recipe-image">
        ${imageMarkup}
      </div>

      <div class="recipe-info">
        <span class="tag">
          ${escapeHTML(recipe.category)}
        </span>

        <h3>${escapeHTML(recipe.title)}</h3>

        <p class="muted">
          Shared by ${escapeHTML(recipe.author)}
        </p>
      </div>
    `;

    const photo = card.querySelector("img");

    if (photo) {
      photo.addEventListener("error", () => {
        photo.parentElement.textContent = emoji;
      });
    }

    card.addEventListener("click", () => {
      openRecipe(recipe);
    });

    recipeGrid.appendChild(card);
  });
}

// ===========================================
// RECIPE DETAILS
// ===========================================

function openRecipe(recipe) {
  const details =
    document.getElementById("recipeDetails");

  const photoURL = safePhotoURL(recipe.photo);

  let photoMarkup = "";

  if (photoURL) {
    photoMarkup = `
      <img class="dialog-image"
           src="${escapeHTML(photoURL)}"
           alt="${escapeHTML(recipe.title)}">
    `;
  }

  details.innerHTML = `
    <h2>${escapeHTML(recipe.title)}</h2>

    ${photoMarkup}

    <p class="muted">
      ${escapeHTML(recipe.category)}
      — Shared by ${escapeHTML(recipe.author)}
    </p>

    <p>
      ${recipe.prep
        ? "<strong>Prep:</strong> " +
          escapeHTML(recipe.prep) + "<br>"
        : ""}

      ${recipe.cook
        ? "<strong>Cook:</strong> " +
          escapeHTML(recipe.cook) + "<br>"
        : ""}

      ${recipe.servings
        ? "<strong>Servings:</strong> " +
          escapeHTML(recipe.servings)
        : ""}
    </p>

    <h3>Ingredients</h3>
    <div class="recipe-text">
      ${escapeHTML(recipe.ingredients)}
    </div>

    <h3>Cooking Instructions</h3>
    <div class="recipe-text">
      ${escapeHTML(recipe.instructions)}
    </div>

    ${recipe.story
      ? `
        <h3>Family Story</h3>
        <div class="recipe-text">
          ${escapeHTML(recipe.story)}
        </div>
        `
      : ""}
  `;

  recipeDialog.showModal();
}

// ===========================================
// BUTTONS AND SEARCH EVENTS
// ===========================================

function scrollToRecipes() {
  document.getElementById("results")
    .scrollIntoView({ behavior: "smooth" });
}

searchInput.addEventListener("input", renderRecipes);

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    scrollToRecipes();
  }
});

categoryFilter.addEventListener(
  "change", renderRecipes
);

document.getElementById("searchButton")
  .addEventListener("click", scrollToRecipes);

document.getElementById("browseButton")
  .addEventListener("click", () => {
    searchInput.value = "";
    categoryFilter.value = "";
    renderRecipes();
    scrollToRecipes();
  });

document.querySelectorAll("[data-category]")
  .forEach(button => {
    button.addEventListener("click", () => {
      searchInput.value = "";
      categoryFilter.value = button.dataset.category;

      // If there are no recipes in that
      // category yet, search for its name.
      if (
        ![...categoryFilter.options].some(
          option => option.value === button.dataset.category
        )
      ) {
        categoryFilter.value = "";
        searchInput.value = button.dataset.category;
      }

      renderRecipes();
      scrollToRecipes();
    });
  });

document.getElementById("refreshButton")
  .addEventListener("click", loadRecipes);

document.getElementById("closeDialog")
  .addEventListener("click", () => {
    recipeDialog.close();
  });

  .addEventListener("click", () => {
